<!DOCTYPE html>

<head>

<body>
    <header class="principal">
        <nav class="menu sticky">
            <a href="index.html" class="start">
                <strong>Inicio</strong>
            </a>
            <a href="servicios.html" class="mid">
                <strong>Servicios</strong>
            </a>
            <a href="contacto.html" class="end">
                <strong>Contacto</strong>
            </a>
        </nav>
    </header>
    <article class="cuerpo">
        <div class="features contacto">
            <form action="#" method="get">
                  <label for="email"><h1>Correo electrónico</h1></label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="tu@email.com"
                        class="texto"
                        required
                    />
                    <br>
                    <label for="message"><h1>Mensaje</h1></label>
                    <textarea name="message" rows="5" cols="40" placeholder="Escribe aquí..."></textarea>
                    <br><br>
                    <button type="submit" class="boton">
                        <strong>
                            Enviar
                        </strong>
                    </button>
            </form>
        </div>
        <div class="features circulo">
        </div>
        <div class="features">
            
        </div>
    </article>
</body>
